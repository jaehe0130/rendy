name: api
on:
  pull_request:
    paths: ["apps/api/**", "database/**", "packages/shared/**"]
jobs:
  build:
    if: ${{ hashFiles('apps/api/package.json') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @rendy/api exec prisma validate
      - run: pnpm --filter @rendy/api build
