openapi: 3.0.3
info:
  title: Rendy API
  version: 0.1.0
  description: |
    web ↔ api 계약. 이 파일이 먼저 바뀌고 구현이 따라온다.
    P0 범위만 정의. P1/P2 엔드포인트는 필요할 때 추가.
servers:
  - url: http://localhost:4000
tags:
  - name: auth
  - name: products
  - name: orders
  - name: rentals
  - name: inspections
  - name: admin
paths:
  /auth/phone/request:
    post:
      tags: [auth]
      summary: 휴대폰 인증번호 요청 (1-2, 해커톤은 mock)
      operationId: requestPhoneCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, birth, carrier, phone]
              properties:
                name: { type: string }
                birth: { type: string, example: "2001-03-04" }
                carrier: { type: string, enum: [SKT, KT, LGU, MVNO] }
                phone: { type: string, example: "010-1234-5678" }
      responses:
        "204": { description: 발송됨 }
  /auth/phone/verify:
    post:
      tags: [auth]
      summary: 인증번호 확인 + 약관 동의 (1-3)
      operationId: verifyPhoneCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, agreements]
              properties:
                phone: { type: string }
                code: { type: string, example: "482913" }
                agreements:
                  type: object
                  properties:
                    terms: { type: boolean }
                    privacy: { type: boolean }
                    damagePolicy: { type: boolean }
                    marketing: { type: boolean }
      responses:
        "200":
          description: 로그인 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  user: { $ref: "#/components/schemas/User" }
  /products:
    get:
      tags: [products]
      summary: 상품 목록 (2-2)
      operationId: listProducts
      parameters:
        - { name: category, in: query, schema: { $ref: "#/components/schemas/Category" } }
        - { name: priceType, in: query, schema: { $ref: "#/components/schemas/PriceType" } }
        - { name: source, in: query, schema: { $ref: "#/components/schemas/DeviceSource" } }
        - { name: available, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProductSummary" }
  /products/{productId}:
    get:
      tags: [products]
      summary: 상품 상세 (2-3) — 상태별 기기, 기기 이력, 리뷰 요약 포함
      operationId: getProduct
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
  /orders:
    post:
      tags: [orders]
      summary: 주문 (2-4 / 3-3 꾸러미 / 7-5 쿠폰) — 꾸러미는 같은 날 받고 같은 날 반납
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items, months, delivery, startDate]
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [productId, priceType, protection]
                    properties:
                      productId: { type: string }
                      priceType: { $ref: "#/components/schemas/PriceType" }
                      protection: { $ref: "#/components/schemas/ProtectionPlan" }
                months: { type: integer, minimum: 2 }
                startDate: { type: string, format: date }
                delivery: { type: string, enum: [HUB_PICKUP, SCHEDULED_DELIVERY] }
                couponIds: { type: array, items: { type: string } }
      responses:
        "201":
          description: 생성
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
  /rentals:
    get:
      tags: [rentals]
      summary: 내 렌탈 목록 (4-1, 2-1 요약)
      operationId: listMyRentals
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Rental" }
  /rentals/{rentalId}/extend:
    post:
      tags: [rentals]
      summary: 연장 (4-2) — 월 단위 또는 마무리 주 단위
      operationId: extendRental
      parameters:
        - { name: rentalId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                months: { type: integer, minimum: 1 }
                weeks: { type: integer, minimum: 1, maximum: 3 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Rental" }
  /rentals/{rentalId}/return:
    post:
      tags: [rentals]
      summary: 반납 신청 (4-4) — 반납 검수(RETURN inspection)를 함께 생성
      operationId: requestReturn
      parameters:
        - { name: rentalId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupDate]
              properties:
                pickupDate: { type: string, format: date }
                address: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
  /inspections:
    post:
      tags: [inspections]
      summary: 검수 생성 (8-1 출고 / 8-2 받은 날)
      operationId: createInspection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage, deviceId]
              properties:
                stage: { $ref: "#/components/schemas/InspectionStage" }
                deviceId: { type: string }
                rentalId: { type: string }
      responses:
        "201":
          description: 생성
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
  /inspections/{inspectionId}/photos:
    post:
      tags: [inspections]
      summary: 면별 사진 업로드
      operationId: uploadInspectionPhoto
      parameters:
        - { name: inspectionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [side, file]
              properties:
                side: { $ref: "#/components/schemas/PhotoSide" }
                file: { type: string, format: binary }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionPhoto" }
  /inspections/{inspectionId}/analyze:
    post:
      tags: [inspections]
      summary: AI 비교 실행 → 예비 판정 (8-2, 8-3, 8-4). 내부에서 ai/vision 호출
      operationId: analyzeInspection
      parameters:
        - { name: inspectionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
  /inspections/{inspectionId}:
    get:
      tags: [inspections]
      summary: 검수 결과 조회 (기준 사진·받은 날 사진·결과 포함)
      operationId: getInspection
      parameters:
        - { name: inspectionId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
  /inspections/{inspectionId}/dispute:
    post:
      tags: [inspections]
      summary: 이의 신청 (결과 후 48시간 이내)
      operationId: disputeInspection
      parameters:
        - { name: inspectionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        "204": { description: 접수 }
  /admin/inspections:
    get:
      tags: [admin]
      summary: 판정 대기 목록 (8-5)
      operationId: listPendingInspections
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/InspectionStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Inspection" }
  /admin/inspections/{inspectionId}/verdict:
    post:
      tags: [admin]
      summary: 운영자 최종 판정 (8-5). AI와 다르면 사유 필수 → 재학습 데이터
      operationId: submitVerdict
      parameters:
        - { name: inspectionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operatingTest, findings]
              properties:
                operatingTest: { type: string, enum: [PASS, FAIL] }
                repairCostKrw: { type: integer }
                findings:
                  type: array
                  items:
                    type: object
                    required: [findingId, finalClass]
                    properties:
                      findingId: { type: string }
                      finalClass: { $ref: "#/components/schemas/DamageClass" }
                      overrideReason: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Inspection" }
components:
  schemas:
    Category:
      type: string
      enum: [SEASONAL, LAUNDRY, KITCHEN, ELECTRONICS, HEATING]
    PriceType:
      type: string
      description: 일반형(STANDARD) / 실속형(VALUE)
      enum: [STANDARD, VALUE]
    DeviceSource:
      type: string
      enum: [NEW, BUYBACK, USED]
    ProtectionPlan:
      type: string
      description: 기본(BASIC) 월 0원 / 안심(SAFE) 월 1,000원 / 완전 안심(FULL) 월 2,000원
      enum: [BASIC, SAFE, FULL]
    InspectionStage:
      type: string
      description: 출고(OUTBOUND, 운영자 6면) / 받은 날(RECEIVED, 고객) / 반납(RETURN, 고객)
      enum: [OUTBOUND, RECEIVED, RETURN]
    InspectionStatus:
      type: string
      enum: [CAPTURING, ANALYZING, PRELIMINARY, NEEDS_REVIEW, FINAL, DISPUTED]
    PhotoSide:
      type: string
      enum: [FRONT, LEFT, RIGHT, BACK, TOP, OPERATING]
    DamageClass:
      type: string
      description: 생활 마모(WEAR) / 과실 파손(FAULT) / 분실·고의(LOSS_OR_INTENTIONAL) / 변화 없음(NONE)
      enum: [NONE, WEAR, FAULT, LOSS_OR_INTENTIONAL]
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        phoneVerified: { type: boolean }
        schoolId: { type: string, nullable: true }
    ProductSummary:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: "제습기 10L" }
        category: { $ref: "#/components/schemas/Category" }
        monthlyFrom: { type: integer, example: 10000 }
        availableCount: { type: integer }
        waitlistCount: { type: integer }
        imageUrl: { type: string }
    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            options:
              type: array
              items:
                type: object
                properties:
                  priceType: { $ref: "#/components/schemas/PriceType" }
                  monthlyPrice: { type: integer }
                  sampleDevice: { $ref: "#/components/schemas/Device" }
            reviewSummary:
              type: object
              description: LLM 요약 (리뷰 n개 분석)
              properties:
                reviewCount: { type: integer }
                reasons:
                  type: array
                  items:
                    type: object
                    properties:
                      label: { type: string }
                      ratio: { type: number }
                pros: { type: string }
                cons: { type: string }
                bestFor: { type: string }
    Device:
      type: object
      description: 개별 기기 (QR 이력 단위, 예 D-0412)
      properties:
        id: { type: string }
        code: { type: string, example: "D-0412" }
        source: { $ref: "#/components/schemas/DeviceSource" }
        grade: { type: string, enum: [A, B] }
        priceType: { $ref: "#/components/schemas/PriceType" }
        conditionScore: { type: integer, example: 92 }
        acquiredAt: { type: string, format: date }
        lastCleanedAt: { type: string, format: date }
        preexistingDamageCount: { type: integer }
    Order:
      type: object
      properties:
        id: { type: string }
        rentals:
          type: array
          items: { $ref: "#/components/schemas/Rental" }
        payToday: { type: integer }
        monthlyTotal: { type: integer }
    Rental:
      type: object
      properties:
        id: { type: string }
        product: { $ref: "#/components/schemas/ProductSummary" }
        device: { $ref: "#/components/schemas/Device" }
        priceType: { $ref: "#/components/schemas/PriceType" }
        protection: { $ref: "#/components/schemas/ProtectionPlan" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [SCHEDULED, ACTIVE, RETURN_REQUESTED, RETURNED, CLOSED] }
        receivedCheckDone: { type: boolean, description: 8-2 받은 날 확인 완료 여부 }
    InspectionPhoto:
      type: object
      properties:
        id: { type: string }
        side: { $ref: "#/components/schemas/PhotoSide" }
        url: { type: string }
        retakeHint: { type: string, nullable: true, description: 반사광 등 다시 찍기 안내 }
    DamageFinding:
      type: object
      properties:
        id: { type: string }
        side: { $ref: "#/components/schemas/PhotoSide" }
        bbox:
          type: array
          description: "[x, y, w, h] 0~1 정규화"
          items: { type: number }
        lengthMm: { type: number }
        preexisting: { type: boolean, description: 출고·받은 날 사진에 이미 있던 흠 }
        aiClass: { $ref: "#/components/schemas/DamageClass" }
        aiConfidence: { type: number }
        needsReview: { type: boolean, description: 2cm 기준 근처 등 운영자 확인 필요 }
        finalClass:
          allOf: [{ $ref: "#/components/schemas/DamageClass" }]
          nullable: true
        overrideReason: { type: string, nullable: true }
    Inspection:
      type: object
      properties:
        id: { type: string }
        stage: { $ref: "#/components/schemas/InspectionStage" }
        status: { $ref: "#/components/schemas/InspectionStatus" }
        deviceId: { type: string }
        rentalId: { type: string, nullable: true }
        photos:
          type: array
          items: { $ref: "#/components/schemas/InspectionPhoto" }
        baselinePhotos:
          type: array
          description: 비교 기준(출고·받은 날) 사진
          items: { $ref: "#/components/schemas/InspectionPhoto" }
        findings:
          type: array
          items: { $ref: "#/components/schemas/DamageFinding" }
        conditionScoreBefore: { type: integer }
        conditionScoreAfter: { type: integer }
        preliminaryCharge:
          type: integer
          description: AI 예비 판정 기준 예상 고객 부담(원)
        finalCharge: { type: integer, nullable: true }
        disputeDeadline: { type: string, format: date-time, nullable: true }
